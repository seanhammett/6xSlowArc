void setup()
{
pinMode(5, OUTPUT);

pinMode(6, OUTPUT);
pinMode(12, OUTPUT);
digitalWrite(5, HIGH);
digitalWrite(12, LOW);
}
void loop() {
digitalWrite(6, HIGH);
delayMicroseconds(5800);
digitalWrite(6, LOW);
delayMicroseconds(5800);
}
// correct timing delays are as follows (10/02/22):
// 11400 for the 1.5m with smaller/higher density hole size and the 1:10 motor
// 8700 for the 1.5m with standard hole size and the 1:10 motor
// 5800 for the 1.5m with standard hole size and the 1:15 motor (approx. 1128 seconds per revolution)
// 260 for arc of absence
