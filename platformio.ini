; PlatformIO Project Configuration File — Slow Arc Controller
;
; Target: ESP32-S3 DevKitC-1, Arduino framework. WiFi + OTA enabled.
; See slow_arc_controller_spec.md for the build spec.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The main firmware excludes the standalone bench tests (each has its own
; setup()/loop(); see the [env:test_*] sections below).
build_src_filter = +<*> -<test_dac.cpp> -<test_stepper.cpp> -<test_arc.cpp>

; This unit is an N32R8V: 32 MB OCTAL (OPI) flash + 8 MB octal PSRAM. The stock
; esp32-s3-devkitc-1 preset is the N8 (8 MB QUAD flash), which drives the flash
; in QIO mode and makes the bootloader assert (do_core_init: flash_ret == ESP_OK)
; before the sketch runs. These three lines select the octal flash/PSRAM build
; and the matching bootloader. (Detected via `esptool flash_id`.)
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; USB-CDC console on the native USB port (DevKitC-1).
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=2

; Motors are driven via MCPWM and the status LED is bit-banged (both built on the
; core, no library), so neither FastAccelStepper nor Adafruit NeoPixel is needed.
lib_deps =
	dfrobot/DFRobot_GP8403 @ ^1.0.0
	thomasfredericks/Bounce2 @ ^2.72
	esp32async/ESPAsyncWebServer @ ^3.6.0
	esp32async/AsyncTCP @ ^3.3.2

; OTA upload (uncomment and set the device address once on-network):
; upload_protocol = espota
; upload_port = slow-arc.local

; ---------------------------------------------------------------------------
; Bench test: drive ONE GP8403 DAC and sweep its output.  (src/test_dac.cpp)
;   pio run -e test_dac -t upload && pio device monitor -e test_dac
; Same WROOM-2 N32R8V flash settings as the app so it boots; Serial is on UART0
; (CP2102 "UART" port). Change the target board address with TEST_DAC_ADDR.
; ---------------------------------------------------------------------------
[env:test_dac]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB

monitor_speed = 115200
upload_speed = 921600

; Compile ONLY the DAC test (its own setup()/loop()); skip the app sources.
build_src_filter = -<*> +<test_dac.cpp>

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=2
	-DTEST_DAC_ADDR=0x58

lib_deps =
	dfrobot/DFRobot_GP8403 @ ^1.0.0

; ---------------------------------------------------------------------------
; Bench test: drive ONE stepper channel (TMC2209 / FastAccelStepper).
;   pio run -e test_stepper -t upload && pio device monitor -e test_stepper
; Pick the channel under test with TEST_STEP_CH (0..5).
; ---------------------------------------------------------------------------
[env:test_stepper]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB

monitor_speed = 115200
upload_speed = 921600

; Compile ONLY the stepper test (its own setup()/loop()); skip the app sources.
build_src_filter = -<*> +<test_stepper.cpp>

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=2
	-DTEST_STEP_CH=0

lib_deps =
	gin66/FastAccelStepper @ ^0.31.0

; ---------------------------------------------------------------------------
; Concurrency test: ALL 6 motors (MCPWM) running at once + DAC boards driven over
; I2C simultaneously. Each motor runs at a distinct speed (BASE + ch*STEP Hz) so
; you can check each one in turn.
;   pio run -e test_arc -t upload && pio device monitor -e test_arc
; ---------------------------------------------------------------------------
[env:test_arc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB

monitor_speed = 115200
upload_speed = 921600

; Compile the concurrency test plus the production StatusLed + InputManager it
; reuses (each has no setup()/loop() of its own).
build_src_filter = -<*> +<test_arc.cpp> +<StatusLed.cpp> +<InputManager.cpp>

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=2
	-DTEST_BASE_HZ=300
	-DTEST_STEP_HZ=300

; STEP pulses come from MCPWM (built into the core); Bounce2 backs InputManager.
lib_deps =
	dfrobot/DFRobot_GP8403 @ ^1.0.0
	thomasfredericks/Bounce2 @ ^2.72
